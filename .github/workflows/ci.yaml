name: Spring Boot CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install Java 21 and cache Maven dependencies
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Compile, test and package application
      - name: Build and test with Maven
        run: mvn -B clean verify

      # 4. Construct lowercase GHCR image name
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # 5. Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 6. Log in to GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Build Docker image and publish on push/manual run
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to Local Kubernetes

    # Wait until CI publishes the Docker image
    needs: build-and-publish

    # Deploy only from trusted branch pushes
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    # Execute on your Windows computer
    runs-on: [self-hosted, windows, local-k8s]

    permissions:
      contents: read

    timeout-minutes: 10

    steps:
      - name: Verify Kubernetes connection
        shell: cmd
        run: |
          kubectl --context docker-desktop get nodes
          kubectl --context docker-desktop get deployment oracle-crud-service

      - name: Deploy new Docker image
        shell: cmd
        run: |
          kubectl --context docker-desktop set image deployment/oracle-crud-service oracle-crud-service=ghcr.io/finance-analyzer-intl/oracle-crud-service:${{ github.sha }}

      - name: Verify Kubernetes rollout
        shell: cmd
        run: |
          kubectl --context docker-desktop rollout status deployment/oracle-crud-service --timeout=180s

      - name: Display deployed image
        shell: cmd
        run: |
          kubectl --context docker-desktop get deployment oracle-crud-service -o=jsonpath="{.spec.template.spec.containers[0].image}"

      - name: Display pods
        shell: cmd
        run: |
          kubectl --context docker-desktop get pods -l app=oracle-crud-service
