name: Spring Boot CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Install Java 21 and cache Maven dependencies
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Compile, test and package application
      - name: Build and test with Maven
        run: mvn -B clean verify

      # 4. SonarQube scan and JaCoCo report
      - name: SonarQube Code Quality Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=finance-analyzer-intl
          -Dsonar.projectKey=Finance-Analyzer-Intl_oracle-crud-service
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

      # 5. Snyk dependency security scanning

      - name: Install Snyk CLI
        run: |
          curl --fail --location --silent --show-error \
            --proto '=https' \
            --proto-redir '=https' \
            https://downloads.snyk.io/cli/stable/snyk-linux \
            --output snyk
          
          chmod +x snyk
          sudo mv snyk /usr/local/bin/snyk
          
          snyk --version

      - name: Scan Maven dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=pom.xml --severity-threshold=high

      # 6. Construct lowercase GHCR image name
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # 7. Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # 8. Build image locally without publishing
      - name: Build Docker image for scanning
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      # 9. Scan image with Trivy
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scan-type: image
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          vuln-type: 'os,library'
          ignore-unfixed: true

      # 10. Authenticate to GHCR
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 11. Publish only after passing Trivy
      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"
          
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"

  deploy-openshift:
    name: Deploy to OpenShift
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    concurrency:
      group: openshift-dev
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@bf1d8fd8fa963cff1d33688473e51f948748991e
        with:
          oc: "4"

      - name: Login to OpenShift
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}

      - name: Verify OpenShift connection
        run: |
          oc whoami
          oc project
          oc get deployment oracle-crud-service

      - name: Apply OpenShift configuration
        run: |
          oc apply -f openshift/configmap.yaml
          oc apply -f openshift/service.yaml
          oc apply -f openshift/route.yaml

      - name: Deploy versioned application image
        run: |
          oc set image deployment/oracle-crud-service \
            oracle-crud-service=ghcr.io/finance-analyzer-intl/oracle-crud-service:${GITHUB_RUN_NUMBER}
          
          oc rollout status deployment/oracle-crud-service \
            --timeout=180s

      - name: Verify deployment
        run: |
          oc get pods
          oc get deployment oracle-crud-service
          oc get route oracle-crud-service