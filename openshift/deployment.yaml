apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-crud-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle-crud-service
  template:
    metadata:
      labels:
        app: oracle-crud-service
    spec:
      containers:
        - name: oracle-crud-service
          image: ghcr.io/finance-analyzer-intl/oracle-crud-service:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: oracle-crud-config
            - secretRef:
                name: oracle-db-secrets

          volumeMounts:
            - name: oracle-wallet
              mountPath: /opt/oracle/wallet
              readOnly: true

      volumes:
        - name: oracle-wallet
          secret:
            secretName: oracle-wallet

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 24

          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
