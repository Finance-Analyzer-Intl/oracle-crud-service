# =====================================================================
# Application
# =====================================================================
spring.application.name=oracle-crud-service
server.port=${SERVER_PORT}

# =====================================================================
# Oracle DataSource
# -----------------------------------------------------------------
# No credentials are hard-coded here. Every value is read from an
# environment variable, with a local/dev fallback after the ':'.
# Set these before starting the app (examples further down), e.g.:
#
#   export DB_URL=jdbc:oracle:thin:@//your-host:1521/YOUR_SERVICE_NAME
#   export DB_USERNAME=your_db_username
#   export DB_PASSWORD=your_db_password
#
# In containers/CI, set them as real environment variables or secrets
# instead of committing values into this file.
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP connection pool
spring.datasource.hikari.pool-name=OracleHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# =====================================================================
# JPA / Hibernate
# -----------------------------------------------------------------
# Hibernate auto-detects the Oracle dialect from the JDBC connection,
# so spring.jpa.database-platform is intentionally left unset.
#
# ddl-auto=update is convenient for local development only: it lets
# Hibernate create/alter the PRODUCTS table and PRODUCT_SEQ sequence
# for you. Switch to "validate" (or "none") and manage schema changes
# with a migration tool (Flyway/Liquibase) once you move beyond local
# dev - see src/main/resources/sql/schema-oracle.sql for the
# equivalent DDL you'd run yourself.
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
